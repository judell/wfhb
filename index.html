<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WFHB Event Moderator</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="xmlui/xmlui-standalone.umd.js"></script>
    <script src="xs-trace.js"></script>
    <script>
      const SUPABASE_URL = 'https://dzpdualvwspgqghrysyz.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_NnzobdoFNU39fjs84UNq8Q_X45oiMG5';
      window.SUPABASE_URL = SUPABASE_URL;
      window.SUPABASE_KEY = SUPABASE_KEY;

      // Date range: now to 3 months out
      const now = new Date();
      const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);
      const threeMonthsLater = new Date(now.getTime() + 90 * 24 * 60 * 60 * 1000);
      window.fromDate = oneHourAgo.toISOString();
      window.toDate = threeMonthsLater.toISOString();

      // --- Moderation state: in-memory, loaded from excluded.json on startup ---
      // Model: exclude sources + reject individual events (by source_uid)
      // Everything from included sources that isn't rejected → shown in viewer
      var _state = { excludedSources: [], rejectedEvents: {} };

      // Load state from excluded.json in the repo (synchronous at startup)
      try {
        var stateXhr = new XMLHttpRequest();
        stateXhr.open('GET', 'https://raw.githubusercontent.com/judell/wfhb/main/excluded.json?t=' + Date.now(), false);
        stateXhr.send();
        if (stateXhr.status === 200) {
          var loaded = JSON.parse(stateXhr.responseText);
          _state.excludedSources = loaded.excludedSources || [];
          var rejObj = {};
          (loaded.rejectedEvents || []).forEach(function(uid) { rejObj[uid] = true; });
          _state.rejectedEvents = rejObj;
        }
      } catch(e) {}

      function getState() {
        return _state;
      }

      window.getExcludedSources = function() {
        return getState().excludedSources;
      };

      window.isSourceExcluded = function(source) {
        return getState().excludedSources.indexOf(source) !== -1;
      };

      window.toggleSource = function(source) {
        const s = getState();
        const idx = s.excludedSources.indexOf(source);
        if (idx === -1) {
          s.excludedSources.push(source);
        } else {
          s.excludedSources.splice(idx, 1);
        }
      };

      window.rejectEvent = function(sourceUid) {
        const s = getState();
        s.rejectedEvents[sourceUid] = true;
      };

      window.unrejectEvent = function(sourceUid) {
        const s = getState();
        delete s.rejectedEvents[sourceUid];
      };

      window.isRejected = function(sourceUid) {
        return !!getState().rejectedEvents[sourceUid];
      };

      // Single-pass classifier
      var _cachedTick = -1;
      var _cached = { visible: [], rejected: [], excludedCount: 0 };

      function classify(events, _tick) {
        if (_tick === _cachedTick && _cached._events === events) return _cached;
        const s = getState();
        const excSet = {};
        s.excludedSources.forEach(function(src) { excSet[src] = true; });
        const visible = [], rejected = [];
        (events || []).forEach(function(e) {
          if (excSet[e.source]) return;
          if (s.rejectedEvents[e.source_uid]) rejected.push(e);
          else visible.push(e);
        });
        _cached = {
          visible: visible,
          rejected: rejected,
          excludedCount: s.excludedSources.length,
          _events: events
        };
        _cachedTick = _tick;
        return _cached;
      }

      window.getVisibleEvents = function(events, _tick) {
        return classify(events, _tick).visible;
      };

      window.getRejectedEvents = function(events, _tick) {
        return classify(events, _tick).rejected;
      };

      window.getExcludedCount = function(events, _tick) {
        classify(events, _tick);
        return _cached.excludedCount;
      };

      window.getSourcesWithCountsReactive = function(events, _tick) {
        const sources = window.getSourcesWithCounts(events);
        sources.sort(function(a, b) {
          if (a.excluded !== b.excluded) return a.excluded ? 1 : -1;
          return a.name.localeCompare(b.name);
        });
        return sources;
      };

      window.paginate = function(arr, limit) {
        return (arr || []).slice(0, limit);
      };

      // Get distinct sources from events with counts
      window.getSourcesWithCounts = function(events) {
        const counts = {};
        (events || []).forEach(function(e) {
          if (e.source) counts[e.source] = (counts[e.source] || 0) + 1;
        });
        return Object.keys(counts).sort().map(function(s) {
          return { name: s, count: counts[s], excluded: window.isSourceExcluded(s) };
        });
      };

      // GitHub token management
      const GH_TOKEN_KEY = 'wfhb_github_token';
      const GH_REPO = 'judell/wfhb';

      window.getGitHubToken = function() {
        return localStorage.getItem(GH_TOKEN_KEY) || '';
      };

      window.setGitHubToken = function(token) {
        localStorage.setItem(GH_TOKEN_KEY, token.trim());
      };

      window.hasGitHubToken = function() {
        return !!localStorage.getItem(GH_TOKEN_KEY);
      };

      // Build the base64-encoded content for excluded.json
      window.buildExcludedContent = function() {
        const s = getState();
        const data = {
          excludedSources: s.excludedSources.sort(),
          rejectedEvents: Object.keys(s.rejectedEvents).sort()
        };
        return btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2) + '\n')));
      };

      // PUT excluded.json to GitHub — called from getSha success/error with a callback
      window.saveToGitHub = function(sha, callback) {
        const token = window.getGitHubToken();
        const body = {
          message: 'Update exclusions',
          content: window.buildExcludedContent()
        };
        if (sha) body.sha = sha;
        fetch('https://api.github.com/repos/judell/wfhb/contents/excluded.json', {
          method: 'PUT',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify(body)
        }).then(function(res) {
          if (res.ok) callback('Saved! Changes will be live in ~1 minute.');
          else res.json().then(function(err) { callback('Error: ' + (err.message || res.status)); });
        }).catch(function(e) {
          callback('Error: ' + e.message);
        });
      };

      // Simple snippet
      window.getSnippet = function(description) {
        if (!description) return '';
        let text = String(description);
        if (/<[a-z][\s\S]*>/i.test(text)) {
          text = text.replace(/<\s*br\s*\/?>/gi, '\n');
          text = text.replace(/<\s*\/p\s*>/gi, '\n');
          text = text.replace(/<\/[^>]+>/g, ' ');
          const doc = new DOMParser().parseFromString(text, 'text/html');
          text = doc.body.textContent || '';
        }
        text = text.replace(/https?:\/\/\S+/g, '').replace(/\s+/g, ' ').trim();
        if (text.length > 150) text = text.substring(0, 150) + '\u2026';
        return text;
      };

      // Format date for display
      window.formatDate = function(isoStr) {
        if (!isoStr) return '';
        const d = new Date(isoStr);
        const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return days[d.getDay()] + ' ' + months[d.getMonth()] + ' ' + d.getDate();
      };

      window.formatTime = function(isoStr) {
        if (!isoStr) return '';
        const d = new Date(isoStr);
        let h = d.getHours();
        const m = d.getMinutes();
        const ampm = h >= 12 ? 'pm' : 'am';
        h = h % 12 || 12;
        return h + (m ? ':' + (m < 10 ? '0' : '') + m : '') + ampm;
      };

      window.formatDateTime = function(isoStr, allDay) {
        if (!isoStr) return '';
        return window.formatDate(isoStr) + (allDay ? ', All Day' : ', ' + window.formatTime(isoStr));
      };
    </script>
  </head>
  <body>
  </body>
</html>
