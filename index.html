<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WFHB Event Moderator</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="xmlui/xmlui-standalone.umd.js"></script>
    <script src="xs-trace.js"></script>
    <script>
      const SUPABASE_URL = 'https://dzpdualvwspgqghrysyz.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_NnzobdoFNU39fjs84UNq8Q_X45oiMG5';
      window.SUPABASE_URL = SUPABASE_URL;
      window.SUPABASE_KEY = SUPABASE_KEY;

      // Date range: now to 3 months out
      const now = new Date();
      const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);
      const threeMonthsLater = new Date(now.getTime() + 90 * 24 * 60 * 60 * 1000);
      window.fromDate = oneHourAgo.toISOString();
      window.toDate = threeMonthsLater.toISOString();

      // --- Moderation state: in-memory, loaded from excluded.json on startup ---
      // Model: exclude sources + reject individual events (by source_uid)
      // Everything from included sources that isn't rejected → shown in viewer
      var _state = { excludedSources: [], excludedCategories: [], excludedEvents: {}, reviewedEvents: {}, lastReviewed: null, requireApproval: true };

      // Load state from excluded.json via GitHub API (no CDN caching)
      try {
        var stateXhr = new XMLHttpRequest();
        stateXhr.open('GET', 'https://api.github.com/repos/judell/wfhb/contents/excluded.json', false);
        stateXhr.setRequestHeader('Accept', 'application/vnd.github.v3+json');
        stateXhr.send();
        if (stateXhr.status === 200) {
          var apiResult = JSON.parse(stateXhr.responseText);
          var loaded = JSON.parse(decodeURIComponent(escape(atob(apiResult.content))));
          _state.excludedSources = loaded.excludedSources || [];
          _state.excludedCategories = loaded.excludedCategories || [];
          var rejObj = {};
          (loaded.excludedEvents || []).forEach(function(uid) { rejObj[uid] = true; });
          _state.excludedEvents = rejObj;
          var revObj = {};
          (loaded.reviewedEvents || []).forEach(function(uid) { revObj[uid] = true; });
          _state.reviewedEvents = revObj;
          _state.lastReviewed = loaded.lastReviewed || null;
          _state.requireApproval = !!loaded.requireApproval;
        }
      } catch(e) {}

      function getState() {
        return _state;
      }

      window.getExcludedSources = function() {
        return getState().excludedSources;
      };

      window.isSourceExcluded = function(source) {
        return getState().excludedSources.indexOf(source) !== -1;
      };

      window.toggleSource = function(source) {
        const s = getState();
        const idx = s.excludedSources.indexOf(source);
        if (idx === -1) {
          s.excludedSources.push(source);
        } else {
          s.excludedSources.splice(idx, 1);
        }
      };

      window.getExcludedCategories = function() {
        return getState().excludedCategories;
      };

      window.isCategoryExcluded = function(category) {
        return getState().excludedCategories.indexOf(category) !== -1;
      };

      window.toggleCategory = function(category) {
        const s = getState();
        const idx = s.excludedCategories.indexOf(category);
        if (idx === -1) {
          s.excludedCategories.push(category);
        } else {
          s.excludedCategories.splice(idx, 1);
        }
      };

      window.excludeEvent = function(sourceUid) {
        const s = getState();
        s.excludedEvents[sourceUid] = true;
      };

      window.includeEvent = function(sourceUid) {
        const s = getState();
        delete s.excludedEvents[sourceUid];
      };

      // Operate on all UIDs in a collapsed group
      window.includeGroup = function(item) {
        var uids = item._groupUids || [item.source_uid];
        uids.forEach(function(uid) { window.includeEvent(uid); });
      };

      window.excludeGroup = function(item) {
        var uids = item._groupUids || [item.source_uid];
        uids.forEach(function(uid) { window.excludeEvent(uid); });
      };

      window.reviewGroup = function(item) {
        var uids = item._groupUids || [item.source_uid];
        uids.forEach(function(uid) { window.markEventReviewed(uid); });
      };

      window.isExcludedEvent = function(sourceUid) {
        return !!getState().excludedEvents[sourceUid];
      };

      // Change detection: snapshot on load, compare current state
      var _savedSnapshot = JSON.stringify([
        _state.excludedSources.slice().sort(),
        _state.excludedCategories.slice().sort(),
        Object.keys(_state.excludedEvents).sort(),
        Object.keys(_state.reviewedEvents).sort(),
        _state.lastReviewed,
        _state.requireApproval
      ]);

      window.hasUnsavedChanges = function(_tick) {
        return JSON.stringify([
          _state.excludedSources.slice().sort(),
          _state.excludedCategories.slice().sort(),
          Object.keys(_state.excludedEvents).sort(),
          Object.keys(_state.reviewedEvents).sort(),
          _state.lastReviewed,
          _state.requireApproval
        ]) !== _savedSnapshot;
      };

      window.getChangeSummary = function() {
        const saved = JSON.parse(_savedSnapshot);
        const cur = [
          _state.excludedSources.slice().sort(),
          _state.excludedCategories.slice().sort(),
          Object.keys(_state.excludedEvents).sort(),
          Object.keys(_state.reviewedEvents).sort(),
          _state.lastReviewed,
          _state.requireApproval
        ];
        const parts = [];
        const addedSources = cur[0].filter(function(s) { return saved[0].indexOf(s) === -1; });
        const removedSources = saved[0].filter(function(s) { return cur[0].indexOf(s) === -1; });
        if (addedSources.length) parts.push(addedSources.length + ' source' + (addedSources.length > 1 ? 's' : '') + ' excluded');
        if (removedSources.length) parts.push(removedSources.length + ' source' + (removedSources.length > 1 ? 's' : '') + ' re-included');
        const addedCats = cur[1].filter(function(s) { return saved[1].indexOf(s) === -1; });
        const removedCats = saved[1].filter(function(s) { return cur[1].indexOf(s) === -1; });
        if (addedCats.length) parts.push(addedCats.length + ' categor' + (addedCats.length > 1 ? 'ies' : 'y') + ' excluded');
        if (removedCats.length) parts.push(removedCats.length + ' categor' + (removedCats.length > 1 ? 'ies' : 'y') + ' re-included');
        const addedRej = cur[2].filter(function(s) { return saved[2].indexOf(s) === -1; });
        const removedRej = saved[2].filter(function(s) { return cur[2].indexOf(s) === -1; });
        if (addedRej.length) parts.push(addedRej.length + ' event' + (addedRej.length > 1 ? 's' : '') + ' excluded');
        if (removedRej.length) parts.push(removedRej.length + ' event' + (removedRej.length > 1 ? 's' : '') + ' re-included');
        const addedRev = cur[3].filter(function(s) { return saved[3].indexOf(s) === -1; });
        if (addedRev.length) parts.push(addedRev.length + ' event' + (addedRev.length > 1 ? 's' : '') + ' included');
        if (cur[4] !== saved[4]) parts.push('review timestamp updated');
        if (cur[5] !== saved[5]) parts.push('approval setting changed');
        return parts.join(', ');
      };

      window.markSaved = function() {
        _savedSnapshot = JSON.stringify([
          _state.excludedSources.slice().sort(),
          _state.excludedCategories.slice().sort(),
          Object.keys(_state.excludedEvents).sort(),
          Object.keys(_state.reviewedEvents).sort(),
          _state.lastReviewed,
          _state.requireApproval
        ]);
      };

      window.getRequireApproval = function() {
        return _state.requireApproval;
      };

      window.setRequireApproval = function(val) {
        _state.requireApproval = !!val;
      };

      window.markEventReviewed = function(sourceUid) {
        _state.reviewedEvents[sourceUid] = true;
      };

      window.markAllReviewed = function(events) {
        _state.lastReviewed = new Date().toISOString();
        // Also mark every current new event as reviewed by source_uid
        if (events) {
          var s = getState();
          var excSet = {};
          s.excludedSources.forEach(function(src) { excSet[src] = true; });
          var excCatSet = {};
          s.excludedCategories.forEach(function(cat) { excCatSet[cat] = true; });
          (events || []).forEach(function(e) {
            if (excSet[e.source]) return;
            if (e.category && excCatSet[e.category]) return;
            if (s.excludedEvents[e.source_uid]) return;
            _state.reviewedEvents[e.source_uid] = true;
          });
        }
      };

      window.getLastReviewed = function() {
        return _state.lastReviewed;
      };

      window.setLastReviewed = function(isoString) {
        _state.lastReviewed = isoString;
      };

      window.clearReviewedEvents = function() {
        _state.reviewedEvents = {};
      };

      window.debugState = function() {
        return {
          lastReviewed: _state.lastReviewed,
          reviewedCount: Object.keys(_state.reviewedEvents).length,
          excludedCount: Object.keys(_state.excludedEvents).length,
          requireApproval: _state.requireApproval
        };
      };

      // Collapse recurring events (same title+location) into one representative per group.
      // The representative carries _groupUids (all source_uids in the group) and _occurrences (count).
      function collapseRecurring(events) {
        var MIN_OCCURRENCES = 3;
        var groups = {};
        var order = [];
        (events || []).forEach(function(e) {
          var key = (e.title || '').trim().toLowerCase() + '|' + (e.location || '').trim().toLowerCase();
          if (!groups[key]) { groups[key] = []; order.push(key); }
          groups[key].push(e);
        });
        var result = [];
        order.forEach(function(key) {
          var g = groups[key];
          if (g.length >= MIN_OCCURRENCES) {
            var rep = Object.assign({}, g[0]);
            rep._groupUids = g.map(function(e) { return e.source_uid; });
            rep._occurrences = g.length;
            result.push(rep);
          } else {
            g.forEach(function(e) { result.push(e); });
          }
        });
        return result;
      }

      window.getNewEvents = function(events, _tick) {
        const lr = _state.lastReviewed;
        if (!lr) return collapseRecurring(events || []);
        const s = getState();
        const excSet = {};
        s.excludedSources.forEach(function(src) { excSet[src] = true; });
        const excCatSet = {};
        s.excludedCategories.forEach(function(cat) { excCatSet[cat] = true; });
        return collapseRecurring((events || []).filter(function(e) {
          if (excSet[e.source]) return false;
          if (e.category && excCatSet[e.category]) return false;
          if (s.excludedEvents[e.source_uid]) return false;
          if (s.reviewedEvents[e.source_uid]) return false;
          return (e.created_at || e.start_time) > lr;
        }));
      };

      // Single-pass classifier
      var _cachedTick = -1;
      var _cached = { visible: [], rejected: [], excludedCount: 0 };

      function classify(events, _tick) {
        if (_tick === _cachedTick && _cached._events === events) return _cached;
        const s = getState();
        const excSet = {};
        s.excludedSources.forEach(function(src) { excSet[src] = true; });
        const excCatSet = {};
        s.excludedCategories.forEach(function(cat) { excCatSet[cat] = true; });
        const lr = s.lastReviewed;
        const approvalOn = s.requireApproval;
        const visible = [], rejected = [], skippedSource = [], skippedCategory = [], skippedUnreviewed = [];
        (events || []).forEach(function(e) {
          if (excSet[e.source]) { skippedSource.push(e); return; }
          if (e.category && excCatSet[e.category]) { skippedCategory.push(e); return; }
          if (s.excludedEvents[e.source_uid]) rejected.push(e);
          else if (approvalOn && lr && (e.created_at || e.start_time) > lr && !s.reviewedEvents[e.source_uid]) { skippedUnreviewed.push(e); return; }
          else visible.push(e);
        });
        window.xsTraceEvent("classify", {
          total: (events || []).length,
          visible: visible.length,
          excluded: rejected.length,
          skippedSource: skippedSource.length,
          skippedCategory: skippedCategory.length,
          skippedUnreviewed: skippedUnreviewed.length,
          approvalOn: approvalOn,
          lastReviewed: lr
        });
        _cached = {
          visible: visible,
          rejected: rejected,
          excludedCount: s.excludedSources.length,
          _events: events
        };
        _cachedTick = _tick;
        return _cached;
      }

      // Count total occurrences across collapsed groups
      window.totalOccurrences = function(collapsedList) {
        if (!collapsedList) return 0;
        var total = 0;
        collapsedList.forEach(function(e) { total += (e._occurrences || 1); });
        return total;
      };

      window.getVisibleEvents = function(events, _tick) {
        return collapseRecurring(classify(events, _tick).visible);
      };

      window.getExcludedEvents = function(events, _tick) {
        return collapseRecurring(classify(events, _tick).rejected);
      };

      window.getExcludedCount = function(events, _tick) {
        classify(events, _tick);
        return _cached.excludedCount;
      };


      window.paginate = function(arr, limit) {
        return (arr || []).slice(0, limit);
      };

      window.pageSlice = function(arr, pageIndex, pageSize) {
        if (!arr) return [];
        var start = pageIndex * pageSize;
        return arr.slice(start, start + pageSize);
      };

      // Merge source_names data with exclusion state
      window.mergeSourceExclusions = function(sourceNames, _tick) {
        if (!sourceNames) return [];
        return sourceNames.map(function(s) {
          return { name: s.name, event_count: s.event_count, excluded: window.isSourceExcluded(s.name) };
        });
      };

      // Merge category data with exclusion state
      window.mergeCategoryExclusions = function(events, _tick) {
        if (!events) return [];
        var counts = {};
        events.forEach(function(e) {
          if (e.category) counts[e.category] = (counts[e.category] || 0) + 1;
        });
        return Object.keys(counts).sort().map(function(cat) {
          return { name: cat, event_count: counts[cat], excluded: window.isCategoryExcluded(cat) };
        });
      };

      window.getExcludedCategoryCount = function(events, _tick) {
        return getState().excludedCategories.length;
      };

      // GitHub token management
      const GH_TOKEN_KEY = 'wfhb_github_token';
      const GH_REPO = 'judell/wfhb';

      window.getGitHubToken = function() {
        return localStorage.getItem(GH_TOKEN_KEY) || '';
      };

      window.setGitHubToken = function(token) {
        localStorage.setItem(GH_TOKEN_KEY, token.trim());
      };

      window.hasGitHubToken = function() {
        return !!localStorage.getItem(GH_TOKEN_KEY);
      };

      // Build the base64-encoded content for excluded.json
      window.buildExcludedContent = function() {
        const s = getState();
        const data = {
          excludedSources: s.excludedSources.sort(),
          excludedCategories: s.excludedCategories.sort(),
          excludedEvents: Object.keys(s.excludedEvents).sort(),
          reviewedEvents: Object.keys(s.reviewedEvents).sort(),
          lastReviewed: s.lastReviewed || null,
          requireApproval: s.requireApproval
        };
        return btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2) + '\n')));
      };

      // Save excluded.json to GitHub with automatic retry on SHA conflict
      window.saveToGitHub = function(sha, callback, _retries) {
        _retries = _retries || 0;
        const token = window.getGitHubToken();
        const url = 'https://api.github.com/repos/judell/wfhb/contents/excluded.json';
        const headers = {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        };
        const body = {
          message: 'Update exclusions',
          content: window.buildExcludedContent()
        };
        if (sha) body.sha = sha;
        fetch(url, { method: 'PUT', headers: headers, body: JSON.stringify(body) })
          .then(function(res) {
            if (res.ok) return callback('Saved!');
            if (res.status === 409 && _retries < 3) {
              // SHA conflict — re-fetch current SHA and retry
              fetch(url, { headers: headers })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                  window.saveToGitHub(data.sha, callback, _retries + 1);
                })
                .catch(function(e) { callback('Error fetching SHA: ' + e.message); });
            } else {
              res.json().then(function(err) { callback('Error: ' + (err.message || res.status)); });
            }
          })
          .catch(function(e) { callback('Error: ' + e.message); });
      };

      // Simple snippet
      window.getSnippet = function(description) {
        if (!description) return '';
        let text = String(description);
        if (/<[a-z][\s\S]*>/i.test(text)) {
          text = text.replace(/<\s*br\s*\/?>/gi, '\n');
          text = text.replace(/<\s*\/p\s*>/gi, '\n');
          text = text.replace(/<\/[^>]+>/g, ' ');
          const doc = new DOMParser().parseFromString(text, 'text/html');
          text = doc.body.textContent || '';
        }
        text = text.replace(/https?:\/\/\S+/g, '').replace(/\s+/g, ' ').trim();
        if (text.length > 150) text = text.substring(0, 150) + '\u2026';
        return text;
      };

      // Decode base64 GitHub API content
      window.decodeBase64 = function(b64) {
        if (!b64) return '';
        return decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
      };

      // Format date for display
      window.formatDate = function(isoStr) {
        if (!isoStr) return '';
        const d = new Date(isoStr);
        const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return days[d.getDay()] + ' ' + months[d.getMonth()] + ' ' + d.getDate();
      };

      window.formatTime = function(isoStr) {
        if (!isoStr) return '';
        const d = new Date(isoStr);
        let h = d.getHours();
        const m = d.getMinutes();
        const ampm = h >= 12 ? 'pm' : 'am';
        h = h % 12 || 12;
        return h + (m ? ':' + (m < 10 ? '0' : '') + m : '') + ampm;
      };

      window.formatDateTime = function(isoStr, allDay) {
        if (!isoStr) return '';
        return window.formatDate(isoStr) + (allDay ? ', All Day' : ', ' + window.formatTime(isoStr));
      };
    </script>
  </head>
  <body>
  </body>
</html>
