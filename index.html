<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WFHB Event Moderator</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="xmlui/xmlui-standalone.umd.js"></script>
    <script src="xs-trace.js"></script>
    <script>
      const SUPABASE_URL = 'https://dzpdualvwspgqghrysyz.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_NnzobdoFNU39fjs84UNq8Q_X45oiMG5';
      window.SUPABASE_URL = SUPABASE_URL;
      window.SUPABASE_KEY = SUPABASE_KEY;

      // Date range: now to 3 months out
      const now = new Date();
      const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);
      const threeMonthsLater = new Date(now.getTime() + 90 * 24 * 60 * 60 * 1000);
      window.fromDate = oneHourAgo.toISOString();
      window.toDate = threeMonthsLater.toISOString();

      // --- Moderation state in localStorage ---
      // Model: exclude sources + reject individual events (by source_uid)
      // Everything from included sources that isn't rejected → shown in viewer
      const STORAGE_KEY = 'wfhb_moderation';

      function loadState() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        } catch(e) { return {}; }
      }

      function saveState(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function getState() {
        const s = loadState();
        if (!s.excludedSources) s.excludedSources = [];
        if (!s.rejectedEvents) s.rejectedEvents = {};
        return s;
      }

      window.getExcludedSources = function() {
        return getState().excludedSources;
      };

      window.isSourceExcluded = function(source) {
        return getState().excludedSources.indexOf(source) !== -1;
      };

      window.toggleSource = function(source) {
        const s = getState();
        const idx = s.excludedSources.indexOf(source);
        if (idx === -1) {
          s.excludedSources.push(source);
        } else {
          s.excludedSources.splice(idx, 1);
        }
        saveState(s);
      };

      window.rejectEvent = function(sourceUid) {
        const s = getState();
        s.rejectedEvents[sourceUid] = true;
        saveState(s);
      };

      window.unrejectEvent = function(sourceUid) {
        const s = getState();
        delete s.rejectedEvents[sourceUid];
        saveState(s);
      };

      window.isRejected = function(sourceUid) {
        return !!getState().rejectedEvents[sourceUid];
      };

      // Single-pass classifier
      var _cachedTick = -1;
      var _cached = { visible: [], rejected: [], excludedCount: 0 };

      function classify(events, _tick) {
        if (_tick === _cachedTick && _cached._events === events) return _cached;
        const s = getState();
        const excSet = {};
        s.excludedSources.forEach(function(src) { excSet[src] = true; });
        const visible = [], rejected = [];
        const allEvents = (events || []).concat(window._simulatedEvents);
        allEvents.forEach(function(e) {
          if (excSet[e.source]) return;
          if (s.rejectedEvents[e.source_uid]) rejected.push(e);
          else visible.push(e);
        });
        _cached = {
          visible: visible,
          rejected: rejected,
          excludedCount: s.excludedSources.length,
          _events: events
        };
        _cachedTick = _tick;
        return _cached;
      }

      window.getVisibleEvents = function(events, _tick) {
        return classify(events, _tick).visible;
      };

      window.getRejectedEvents = function(events, _tick) {
        return classify(events, _tick).rejected;
      };

      window.getExcludedCount = function(events, _tick) {
        classify(events, _tick);
        return _cached.excludedCount;
      };

      window.getSourcesWithCountsReactive = function(events, _tick) {
        const sources = window.getSourcesWithCounts(events);
        sources.sort(function(a, b) {
          if (a.excluded !== b.excluded) return a.excluded ? 1 : -1;
          return a.name.localeCompare(b.name);
        });
        return sources;
      };

      window.paginate = function(arr, limit) {
        return (arr || []).slice(0, limit);
      };

      // Get distinct sources from events with counts
      window.getSourcesWithCounts = function(events) {
        const counts = {};
        (events || []).forEach(function(e) {
          if (e.source) counts[e.source] = (counts[e.source] || 0) + 1;
        });
        return Object.keys(counts).sort().map(function(s) {
          return { name: s, count: counts[s], excluded: window.isSourceExcluded(s) };
        });
      };

      // Export excluded.json — download as file
      window.exportExcluded = function() {
        const s = getState();
        const data = {
          excludedSources: s.excludedSources.sort(),
          rejectedEvents: Object.keys(s.rejectedEvents).sort()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'excluded.json';
        a.click();
        URL.revokeObjectURL(url);
      };

      // Simple snippet
      window.getSnippet = function(description) {
        if (!description) return '';
        let text = String(description);
        if (/<[a-z][\s\S]*>/i.test(text)) {
          text = text.replace(/<\s*br\s*\/?>/gi, '\n');
          text = text.replace(/<\s*\/p\s*>/gi, '\n');
          text = text.replace(/<\/[^>]+>/g, ' ');
          const doc = new DOMParser().parseFromString(text, 'text/html');
          text = doc.body.textContent || '';
        }
        text = text.replace(/https?:\/\/\S+/g, '').replace(/\s+/g, ' ').trim();
        if (text.length > 150) text = text.substring(0, 150) + '\u2026';
        return text;
      };

      // Simulate new events from nightly build
      var _nextFakeId = 900000;
      window._simulatedEvents = [];
      window.simulateNewEvents = function() {
        const fakeEvents = [
          { title: 'Bloomington Symphony Orchestra: Spring Concert', location: 'Buskirk-Chumley Theater', source: 'Buskirk-Chumley Theater', category: 'Music', description: 'Join us for an evening of classical music featuring works by Dvorak and Brahms.', source_uid: 'sim-symphony-spring' },
          { title: 'Farm to Table Dinner at Switchyard', location: 'Switchyard Park', source: 'Bloomington Parks & Rec', category: 'Food / Drink', description: 'A community dinner featuring locally sourced ingredients from Monroe County farms.', source_uid: 'sim-farm-table' },
          { title: 'Poetry Open Mic Night', location: 'The Bishop Bar', source: 'WFHB Community Calendar', category: 'Performing Arts', description: 'Share your original poetry or just listen. All skill levels welcome.', source_uid: 'sim-poetry-mic' },
          { title: 'Yoga in the Park', location: 'Bryan Park', source: 'Bloomington Parks & Rec', category: 'Sports / Fitness', description: 'Free outdoor yoga session for all levels. Bring your own mat.', source_uid: 'sim-yoga-park' },
          { title: 'Makers Market Pop-Up', location: 'B-Line Trail Fountain Square', source: 'BloomingtonOnline.net', category: 'Shopping', description: 'Local artisans showcase handmade goods, crafts, and art.', source_uid: 'sim-makers-market' },
          { title: 'IU Cinema: Documentary Screening', location: 'IU Cinema', source: 'IU Cinema', category: 'Film', description: 'Special screening followed by Q&A with the director.', source_uid: 'sim-iu-cinema-doc' },
          { title: 'Trivia Night at Upland', location: 'Upland Brewing Co.', source: 'BloomingtonOnline.net', category: 'Social', description: 'Teams of up to 6. Prizes for top 3 finishers.', source_uid: 'sim-trivia-upland' },
          { title: 'Kids Storytime: Dinosaur Adventures', location: 'Monroe County Public Library', source: 'Monroe County Public Library', category: 'Kids / Family', description: 'Interactive storytime for ages 3-7 with dinosaur crafts afterward.', source_uid: 'sim-storytime-dino' },
          { title: 'Contra Dance with Live Band', location: 'Bloomington Unitarian Church', source: 'WFHB Community Calendar', category: 'Music', description: 'No experience needed. All dances taught. Beginners welcome at 7pm.', source_uid: 'sim-contra-dance' },
          { title: 'Tech Meetup: AI Tools for Small Business', location: 'Dimension Mill', source: 'Dimension Mill', category: 'Technology', description: 'Learn how local businesses are using AI tools to streamline operations.', source_uid: 'sim-tech-meetup' },
          { title: 'Gallery Opening: New Perspectives', location: 'Ivy Tech John Waldron Arts Center', source: 'Ivy Tech Waldron', category: 'Visual Arts', description: 'Opening reception for mixed media exhibition by regional artists.', source_uid: 'sim-gallery-opening' },
          { title: 'Saturday Morning Bird Walk', location: 'Griffy Lake Nature Preserve', source: 'Bloomington Parks & Rec', category: 'Nature / Outdoors', description: 'Guided birding walk. Binoculars provided. Meet at the trailhead parking lot.', source_uid: 'sim-bird-walk' },
        ];
        const now = new Date();
        fakeEvents.forEach(function(fe, i) {
          const daysOut = 2 + Math.floor(i * 2.5);
          const hour = 9 + (i % 12);
          const start = new Date(now.getTime() + daysOut * 24 * 60 * 60 * 1000);
          start.setHours(hour, 0, 0, 0);
          const end = new Date(start.getTime() + 2 * 60 * 60 * 1000);
          fe.id = _nextFakeId++;
          fe.start_time = start.toISOString();
          fe.end_time = end.toISOString();
          fe.url = '';
          fe.image_url = null;
          fe.all_day = false;
          fe.city = 'bloomington';
          window._simulatedEvents.push(fe);
        });
      };

      // Format date for display
      window.formatDate = function(isoStr) {
        if (!isoStr) return '';
        const d = new Date(isoStr);
        const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return days[d.getDay()] + ' ' + months[d.getMonth()] + ' ' + d.getDate();
      };

      window.formatTime = function(isoStr) {
        if (!isoStr) return '';
        const d = new Date(isoStr);
        let h = d.getHours();
        const m = d.getMinutes();
        const ampm = h >= 12 ? 'pm' : 'am';
        h = h % 12 || 12;
        return h + (m ? ':' + (m < 10 ? '0' : '') + m : '') + ampm;
      };

      window.formatDateTime = function(isoStr, allDay) {
        if (!isoStr) return '';
        return window.formatDate(isoStr) + (allDay ? ', All Day' : ', ' + window.formatTime(isoStr));
      };
    </script>
  </head>
  <body>
  </body>
</html>
